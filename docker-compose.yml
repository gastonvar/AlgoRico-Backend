name: algorico

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-algorico
    environment:
      POSTGRES_USER: algorico
      POSTGRES_PASSWORD: algorico
      POSTGRES_DB: algorico
    ports:
      - '5433:5432'
    volumes:
      - algorico_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U algorico -d algorico']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio-algorico
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: algorico
      MINIO_ROOT_PASSWORD: algorico_dev_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - algorico_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-init-algorico
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 algorico algorico_dev_secret &&
      mc mb --ignore-existing local/algorico &&
      exit 0
      "

volumes:
  algorico_pg_data:
    name: algorico_pg_data
  algorico_minio_data:
    name: algorico_minio_data
