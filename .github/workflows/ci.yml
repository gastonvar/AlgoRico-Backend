name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Notify homelab deployer
        env:
          URL: ${{ secrets.HOMELAB_DEPLOY_URL }}
          SECRET: ${{ secrets.HOMELAB_DEPLOY_SECRET }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          DELIVERY: actions-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$URL"
          test -n "$SECRET"
          body=$(jq -nc --arg ref "$REF" --arg repo "$REPO" --arg sha "$SHA" \
            '{ref:$ref, after:$sha, repository:{full_name:$repo}}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          curl --fail --silent --show-error --max-time 15 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=${sig}" \
            -H 'X-GitHub-Event: push' \
            -H "X-GitHub-Delivery: ${DELIVERY}" \
            --data "$body" \
            "$URL"
